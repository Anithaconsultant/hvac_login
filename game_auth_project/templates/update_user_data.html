{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 style="color:#fff;">Update Game Progress</h2>
    
    {# Show status messages #}
    {% if messages %}
    <div class="alert-messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}"{% endif %}>
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label style="color:#fff;">Your Progress Data</label>
            <textarea name="user_data" class="auth-form-control"
                placeholder="Enter your game progress...">{% if user_data %}{{ user_data }}{% endif %}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Progress</button>
    </form>
</div>
{% endblock %}
