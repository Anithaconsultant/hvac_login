<!DOCTYPE html>
<html lang="en-us">

<head>

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>{{ task_name }}</title>

    <!-- ========================================== -->
    <!-- FAVICON -->
    <!-- ========================================== -->

    <link rel="icon" type="image/png"
        href="https://dev.phantom-load.in/apps/Tasks/{{ task_name }}/TemplateData/favicon.png?v=2">

    <link rel="shortcut icon" type="image/png"
        href="https://dev.phantom-load.in/apps/Tasks/{{ task_name }}/TemplateData/favicon.png?v=2">

    <!-- ========================================== -->
    <!-- CSS -->
    <!-- ========================================== -->

    <link rel="stylesheet" href="https://dev.phantom-load.in/apps/Tasks/{{ task_name }}/TemplateData/style.css">

    <!-- ========================================== -->
    <!-- USER DATA -->
    <!-- ========================================== -->

    <script>
        window.gameAuthToken = "{{ jwt_token|escapejs }}";

        window.username = "{{ username|escapejs }}";

        window.userId = "{{ user_id|escapejs }}";

        window.userEmail = "{{ user_email|escapejs }}";

        window.userGender = "{{ user_gender|escapejs }}";

        window.webglSessionId = "{{ webgl_session_id|escapejs }}";

        console.log("TOKEN:", window.gameAuthToken);

        console.log("SESSION:", window.webglSessionId);

    </script>

</head>

<body>

    <!-- ========================================== -->
    <!-- UNITY CONTAINER -->
    <!-- ========================================== -->

    <div id="unity-container" class="unity-desktop">

        <canvas id="unity-canvas" width="1280" height="720" tabindex="-1">
        </canvas>

        <!-- ========================================== -->
        <!-- LOADING BAR -->
        <!-- ========================================== -->

        <div id="unity-loading-bar">

            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">

                <div id="unity-progress-bar-full"></div>

            </div>

            <div id="unity-loading-text">
                This may take a few minutes
            </div>

        </div>

        <!-- ========================================== -->
        <!-- WARNINGS -->
        <!-- ========================================== -->

        <div id="unity-warning"></div>

        <!-- ========================================== -->
        <!-- FOOTER -->
        <!-- ========================================== -->

        <div id="unity-footer">

            <div id="unity-logo-title-footer"></div>

            <div id="unity-fullscreen-button"></div>

            <div id="unity-build-title">

                {{ task_name }}

            </div>

        </div>

    </div>

    <!-- ========================================== -->
    <!-- UNITY SCRIPT -->
    <!-- ========================================== -->
    <script>

        var canvas = document.querySelector("#unity-canvas");

        // ==========================================
        // UNITY WARNING BANNER
        // ==========================================

        function unityShowBanner(msg, type) {

            var warningBanner =
                document.querySelector("#unity-warning");

            function updateBannerVisibility() {

                warningBanner.style.display =
                    warningBanner.children.length
                        ? 'block'
                        : 'none';
            }

            var div = document.createElement('div');

            div.innerHTML = msg;

            warningBanner.appendChild(div);

            if (type == 'error') {

                div.style =
                    'background: red; padding: 10px;';

            } else {

                if (type == 'warning') {

                    div.style =
                        'background: yellow; padding: 10px;';
                }

                setTimeout(function () {

                    warningBanner.removeChild(div);

                    updateBannerVisibility();

                }, 5000);
            }

            updateBannerVisibility();
        }

        // ==========================================
        // UNITY BUILD URLS
        // ==========================================

        var buildUrl =
            "https://dev.phantom-load.in/apps/Tasks/{{ task_name }}/Build";

        var loaderUrl =
            buildUrl +
            "/Build.loader.js";

        // ==========================================
        // UNITY CONFIG
        // ==========================================

        var config = {

            arguments: [],

            dataUrl:
                buildUrl +
                "/Build.data",

            frameworkUrl:
                buildUrl +
                "/Build.framework.js",

            codeUrl:
                buildUrl +
                "/Build.wasm",

            streamingAssetsUrl:
                "https://dev.phantom-load.in/apps/Tasks/{{ task_name }}/StreamingAssets",

            companyName: "IIHS",

            productName: "PHANTOM LOAD",

            productVersion: "7.3",

            showBanner: unityShowBanner,
        };

        // ==========================================
        // MOBILE HANDLING
        // ==========================================

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

            var meta = document.createElement('meta');

            meta.name = 'viewport';

            meta.content =
                'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

            document.getElementsByTagName('head')[0]
                .appendChild(meta);

            document.querySelector("#unity-container")
                .className = "unity-mobile";

            canvas.className = "unity-mobile";

        } else {

            canvas.style.width = "1280px";

            canvas.style.height = "720px";
        }

        // ==========================================
        // BACKGROUND IMAGE
        // ==========================================

        canvas.style.background =
            "url('" +
            buildUrl +
            "/Build.jpg') center / cover";

        // ==========================================
        // SHOW LOADING BAR
        // ==========================================

        document.querySelector("#unity-loading-bar")
            .style.display = "block";

        // ==========================================
        // LOAD UNITY LOADER SCRIPT
        // ==========================================

        var script = document.createElement("script");

        script.src = loaderUrl;

        script.onload = () => {

            console.log("UNITY LOADER LOADED");

            createUnityInstance(
                canvas,
                config,

                (progress) => {

                    document.querySelector(
                        "#unity-progress-bar-full"
                    ).style.width =
                        100 * progress + "%";
                }

            ).then((unityInstance) => {

                console.log("UNITY LOADED SUCCESS");

                document.querySelector(
                    "#unity-loading-bar"
                ).style.display = "none";

                document.querySelector(
                    "#unity-fullscreen-button"
                ).onclick = () => {

                    unityInstance.SetFullscreen(1);
                };

            }).catch((message) => {

                console.error("UNITY ERROR:", message);

                alert(message);
            });
        };

        document.body.appendChild(script);

    </script>
    <script>

        // ==========================================
        // SESSION VARIABLES
        // ==========================================

        const SESSION_ID = window.webglSessionId;

        let ACCESS_TOKEN =
            "{{ access_token|escapejs }}";

        const REFRESH_TOKEN =
            "{{ refresh_token|escapejs }}";

        async function refreshAccessToken() {
            console.log(
                "Refreshing token..."
            );
            try {

                const response = await fetch(
                    "/api/refresh/token/",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            refresh: REFRESH_TOKEN
                        })
                    }
                );

                if (!response.ok) {

                    console.error(
                        "Token refresh failed"
                    );

                    return false;
                }

                const data =
                    await response.json();

                ACCESS_TOKEN =
                    data.access;

                console.log(
                    "Access token refreshed"
                );

                return true;

            } catch (error) {

                console.error(
                    "Refresh error:",
                    error
                );

                return false;
            }
        }
        async function sendHeartbeat() {
            //  alert(TOKEN)
            try {

                const response = await fetch(
                    "/api/webgl/ping/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + ACCESS_TOKEN
                        },

                        body: JSON.stringify({
                            session_id: SESSION_ID
                        })
                    }
                );



                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    console.log(
                        "Access token expired"
                    );

                    const refreshed =
                        await refreshAccessToken();

                    if (refreshed) {

                        console.log(
                            "Retrying heartbeat"
                        );

                        return sendHeartbeat();
                    }

                    alert(
                        "Login expired."
                    );

                    window.location.href =
                        "/accounts/login/";

                    return;
                }
                if (response.status === 400) {

                    alert(
                        "Session closed."
                    );

                    window.location.href =
                        "/home/";

                    return;
                }
                // ==================================
                // OTHER ERRORS
                // ==================================

                if (!response.ok) {

                    console.error(
                        "Heartbeat failed:",
                        response.status
                    );

                    return;
                }

                // ==================================
                // SUCCESS
                // ==================================

                const data =
                    await response.json();

                console.log(
                    "Heartbeat success:",
                    SESSION_ID,
                    new Date().toISOString()
                );

            } catch (error) {

                console.error(
                    "Heartbeat error:",
                    error
                );
            }
        }


        window.addEventListener("beforeunload", function () {

            fetch("/api/webgl/close/", {
                method: "POST",
                keepalive: true,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + ACCESS_TOKEN
                },
                body: JSON.stringify({
                    session_id: SESSION_ID
                })
            }).catch(error => {
                console.error(
                    "SESSION CLOSE ERROR:",
                    error
                );
            });

        });


        sendHeartbeat();

        // every 20 sec
        setInterval(
            sendHeartbeat,
            30000
        );


    </script>

</body>

</html>
